<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>申的博客 · 写作</title>
<style>
  :root{
    --sans:"Segoe UI Variable Text",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
    --paper:#ffffff;
    --shell:#f8f6f2;
    --shell-2:#f1eee9;
    --line:#eae6e0;
    --line-soft:#f1eee9;
    --ink:#1a1916;
    --ink-2:#57544e;
    --ink-3:#8d8981;
    --ink-4:#b8b3aa;
    --accent:#a9593a;
    --accent-soft:#f6ede7;
    --ok:#5a7558;
    --danger:#ac4034;
    --shadow-1:0 1px 2px rgba(26,25,22,.05);
    --shadow-2:0 12px 32px -12px rgba(26,25,22,.18),0 2px 8px rgba(26,25,22,.06);
  }
  [data-theme="dark"]{
    --paper:#1a1917;
    --shell:#131211;
    --shell-2:#1f1e1b;
    --line:#2b2925;
    --line-soft:#232220;
    --ink:#ece8e1;
    --ink-2:#a8a49b;
    --ink-3:#7d786f;
    --ink-4:#5b574f;
    --accent:#d18a65;
    --accent-soft:#2a211c;
    --ok:#8aa887;
    --danger:#e0715f;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 16px 40px -12px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans);background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font-family:inherit;color:inherit;background:none;border:0;outline:none}
  ::selection{background:var(--accent-soft);color:var(--accent)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:transparent;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:var(--line)}

  .app{height:100vh;display:grid;grid-template-rows:56px minmax(0,1fr) 48px}

  /* ---------- 顶栏 ---------- */
  .bar{
    display:flex;align-items:center;gap:16px;padding:0 16px 0 18px;
    background:var(--shell);border-bottom:1px solid var(--line);
    user-select:none;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:none}
  .mark{
    width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
    background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;letter-spacing:.02em;
  }
  .wordmark{font-size:13.5px;font-weight:600;letter-spacing:.02em;line-height:1.2}
  .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;margin-top:1px;font-family:var(--mono)}
  .crumb{
    display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);
    font-family:var(--mono);letter-spacing:.02em;overflow:hidden;white-space:nowrap;
  }
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .state{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);padding-right:8px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 12%,transparent)}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 12%,transparent)}
  .icon{
    width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
    color:var(--ink-2);transition:background .14s,color .14s;
  }
  .icon:hover{background:var(--shell-2);color:var(--ink)}
  .icon svg{width:16px;height:16px;stroke-width:1.6}
  .ghost{
    height:32px;padding:0 13px;border-radius:8px;font-size:12.5px;color:var(--ink-2);
    display:flex;align-items:center;gap:6px;border:1px solid transparent;
    transition:all .14s;
  }
  .ghost:hover{background:var(--shell-2);color:var(--ink);border-color:var(--line)}
  .ghost svg{width:13px;height:13px;stroke-width:2}

  /* ---------- 主体 ---------- */
  .body{display:grid;grid-template-columns:var(--side-w,290px) minmax(0,1fr) var(--pv-w,404px);min-height:0;transition:grid-template-columns .26s cubic-bezier(.3,.9,.3,1)}
  .body.no-pv{--pv-w:0px}
  .app.focus{--side-w:0px;--pv-w:0px}
  .app.focus .side{opacity:0;pointer-events:none;overflow:hidden}
  .app.focus .pv{opacity:0;pointer-events:none}

  /* 侧栏 */
  .side{
    background:var(--shell);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;user-select:none;
  }
  .side-top{padding:14px 14px 10px}
  .search{
    display:flex;align-items:center;gap:7px;height:31px;padding:0 10px;
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    transition:border-color .14s,box-shadow .14s;
  }
  .search:focus-within{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}
  .search svg{width:13px;height:13px;color:var(--ink-4);stroke-width:1.8;flex:none}
  .search input{flex:1;font-size:12.5px;min-width:0}
  .search input::placeholder{color:var(--ink-4)}
  .side-meta{padding:0 15px 9px;font-size:10.5px;color:var(--ink-4);font-family:var(--mono);letter-spacing:.02em}

  .list{flex:1;overflow-y:auto;padding:2px 8px 24px}
  .ylab{
    position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:9px;
    padding:13px 8px 6px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-4);
    background:var(--shell);text-transform:uppercase;
  }
  .ylab span{flex:none}
  .ylab .yr{flex:1;height:1px;background:var(--line)}
  .ylab em{font-style:normal;font-family:var(--mono);letter-spacing:0;font-size:10px;color:var(--ink-4)}
  .mlab{
    display:flex;align-items:baseline;gap:8px;padding:9px 8px 3px;
    font-size:10px;letter-spacing:.1em;color:var(--ink-4);font-family:var(--mono);
  }
  .mlab em{font-style:normal;letter-spacing:0;opacity:.7}
  .row{
    position:relative;display:flex;align-items:baseline;gap:8px;
    padding:5px 26px 5px 9px;border-radius:7px;cursor:pointer;
    transition:background .12s;
  }
  .row:hover{background:var(--shell-2)}
  .row.on{background:var(--shell-2);box-shadow:inset 2px 0 0 var(--accent)}
  .row.on .t{font-weight:600;color:var(--ink)}
  .t{
    font-size:12.5px;color:var(--ink-2);line-height:1.45;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
  }
  .rd{font-size:10.5px;color:var(--ink-4);font-family:var(--mono);flex:none}
  .chg{width:4px;height:4px;border-radius:50%;background:#b0782a;flex:none;margin-bottom:2px;opacity:.85}
  .del{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
    color:var(--ink-4);opacity:0;transition:all .12s;font-size:14px;line-height:1;
  }
  .row:hover .del{opacity:1}
  .del:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
  .list-empty{padding:22px 10px;font-size:11.5px;color:var(--ink-4);text-align:center;line-height:1.7}

  /* 编辑区 */
  .doc{overflow-y:auto;background:var(--paper);scroll-behavior:smooth}
  .col{max-width:720px;margin:0 auto;padding:60px 44px 160px}
  .title{
    width:100%;font-size:28px;line-height:1.35;font-weight:600;letter-spacing:-.015em;
    padding:0;margin:0 0 6px;
  }
  .title::placeholder{color:var(--ink-4);font-weight:500}
  .meta{display:flex;align-items:center;gap:12px;margin-top:12px;padding-bottom:20px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .meta input.date{
    font-size:11.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.02em;
    width:113px;padding:2px 0;transition:color .14s;
  }
  .meta input.date:hover{color:var(--ink-2)}
  .meta input.date::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer;scale:.85}
  .meta input.time{
    font-size:11.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.02em;
    width:74px;padding:2px 0;
  }
  .meta input.time:hover{color:var(--ink-2)}
  .meta input.time::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer;scale:.85}
  .meta input.tags{font-size:11.5px;color:var(--ink-3);width:170px;padding:2px 0}
  .meta input.tags::placeholder{color:var(--ink-4)}
  .meta .sep{width:1px;height:12px;background:var(--line);flex:none}

  .tools{
    position:sticky;top:0;z-index:3;display:flex;gap:1px;align-items:center;
    margin:18px 0 10px;padding:4px;border-radius:10px;
    background:color-mix(in srgb,var(--shell) 88%,transparent);
    border:1px solid var(--line);box-shadow:var(--shadow-1);
    backdrop-filter:blur(10px);width:max-content;
    opacity:.78;transition:opacity .18s;
  }
  .tools:hover,.tools:focus-within{opacity:1}
  .tb{
    min-width:27px;height:27px;padding:0 6px;border-radius:7px;display:grid;place-items:center;
    color:var(--ink-2);font-size:12px;transition:background .12s,color .12s;
  }
  .tb:hover{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-1)}
  .tb b{font-weight:700}
  .tb div{width:1px;height:15px;background:var(--line);margin:0 3px}
  .tb svg{width:14px;height:14px;stroke-width:1.7}
  #body{
    width:100%;border:0;outline:none;resize:none;background:none;
    font-size:17px;line-height:1.9;letter-spacing:.003em;color:var(--ink);
    min-height:60vh;padding:10px 0 60px;caret-color:var(--accent);
  }
  #body::placeholder{color:var(--ink-4)}

  /* 预览 */
  .pv{
    border-left:1px solid var(--line);background:var(--shell);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    transition:opacity .22s;
  }
  .body.no-pv .pv{opacity:0;pointer-events:none}
  .pv-head{
    height:40px;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px 0 18px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-4);
    text-transform:uppercase;border-bottom:1px solid var(--line-soft);flex:none;
  }
  .pv-paper{overflow-y:auto;padding:38px 34px 60px;min-height:0}
  .pv-paper h1{font-size:22px;line-height:1.4;letter-spacing:-.01em;margin:0 0 6px;font-weight:600}
  .pv-paper .pvdate{font-size:10.5px;color:var(--ink-4);font-family:var(--mono);margin-bottom:20px}
  .pv-paper p{font-size:14px;line-height:1.95;color:var(--ink-2);margin:0 0 15px}
  .pv-paper h2{font-size:16px;margin:26px 0 8px;font-weight:600}
  .pv-paper h3{font-size:14.5px;margin:20px 0 6px;font-weight:600}
  .pv-paper ul,.pv-paper ol{margin:0 0 15px;padding-left:18px;color:var(--ink-2);font-size:14px;line-height:1.9}
  .pv-paper blockquote{margin:0 0 15px;padding:2px 0 2px 13px;border-left:2px solid var(--line);color:var(--ink-3);font-size:13.5px;line-height:1.9}
  .pv-paper pre{background:var(--shell-2);padding:12px 14px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.7;margin:0 0 15px}
  .pv-paper code{font-family:var(--mono);font-size:12.5px;background:var(--shell-2);padding:1px 4px;border-radius:4px}
  .pv-paper hr{border:0;border-top:1px solid var(--line);margin:22px 0}
  .pv-paper img{max-width:100%;border-radius:6px}
  .pv-paper a{color:var(--accent);text-decoration:none}
  .pv-empty{color:var(--ink-4);font-size:12px}

  /* 底栏 */
  .foot{
    display:flex;align-items:center;gap:14px;padding:0 16px 0 18px;
    background:var(--shell);border-top:1px solid var(--line);user-select:none;
    font-size:11.5px;color:var(--ink-3);
  }
  .foot-l,.foot-m{display:flex;align-items:center;gap:10px;min-width:0}
  .foot-m{margin:0 auto;gap:14px}
  .foot-r{margin-left:auto;display:flex;align-items:center;gap:4px}
  .sep{width:1px;height:11px;background:var(--line)}
  .savedot{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none;transition:background .2s}
  .savedot.dirty{background:var(--accent)}
  .savedot.err{background:var(--danger)}
  #path{font-family:var(--mono);color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
  .rmv{height:28px;padding:0 10px;border-radius:7px;font-size:11.5px;color:var(--ink-3);transition:all .14s}
  .rmv:hover{background:color-mix(in srgb,var(--danger) 9%,transparent);color:var(--danger)}
  .rmv:disabled{opacity:.35;cursor:default}
  .primary{
    height:30px;padding:0 14px 0 15px;border-radius:8px;background:var(--ink);color:var(--paper);
    font-size:12px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:5px;
    transition:transform .14s,opacity .14s,background .14s;
  }
  .primary:hover{opacity:.9;transform:translateY(-1px)}
  .primary:active{transform:none}
  .primary:disabled{opacity:.4;transform:none;cursor:default}
  .primary svg{width:12px;height:12px;stroke-width:2;opacity:.8}

  /* 对话框 / 提示 */
  .mask{
    position:fixed;inset:0;display:grid;place-items:center;z-index:50;
    background:color-mix(in srgb,var(--ink) 10%,transparent);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .mask.on{opacity:1;pointer-events:auto}
  .dlg{
    width:352px;background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:22px 22px 18px;box-shadow:var(--shadow-2);
    transform:translateY(6px) scale(.98);transition:transform .18s;
  }
  .mask.on .dlg{transform:none}
  .dlg h3{margin:0 0 6px;font-size:14px;font-weight:600;letter-spacing:.01em}
  .dlg p{margin:0 0 16px;font-size:12px;line-height:1.75;color:var(--ink-3);white-space:pre-line}
  .dlg input{
    width:100%;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
    font-size:13px;margin-bottom:16px;background:var(--shell);
  }
  .dlg input:focus{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}
  .dlg-act{display:flex;justify-content:flex-end;gap:8px}
  .dlg-act .ghost{border:1px solid var(--line)}
  .dlg-act .primary{padding:0 14px}
  .dlg.wide{width:432px}
  .fld{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .fld>span{width:40px;flex:none;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
  .fld input,.fld textarea{
    flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;background:var(--shell);resize:none;
  }
  .fld textarea{height:auto;padding:7px 10px;line-height:1.6;font-size:12px}
  .fld input:focus,.fld textarea:focus{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}
  .fld input::placeholder,.fld textarea::placeholder{color:var(--ink-4)}

  /* 版式切换 */
  .themerow{align-items:flex-start;margin-top:4px}
  .themes{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
  .themes button{
    height:27px;padding:0 9px;border:1px solid var(--line);border-radius:7px;
    background:var(--shell);font-size:11.5px;color:var(--ink-2);transition:all .14s;white-space:nowrap;
  }
  .themes button:hover{border-color:color-mix(in srgb,var(--accent) 42%,var(--line));color:var(--ink)}
  .themes button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
  .dlg .hint{margin:2px 0 14px;font-size:11px;line-height:1.7;color:var(--ink-4);white-space:normal}

  .toast{
    position:fixed;left:50%;bottom:64px;transform:translate(-50%,8px);z-index:60;
    background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--paper);
    padding:9px 15px;border-radius:9px;font-size:12px;letter-spacing:.01em;
    box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:all .2s;
    max-width:70vw;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* 命令面板 */
  .palette{
    position:fixed;inset:0;z-index:55;display:flex;justify-content:center;
    padding-top:11vh;background:color-mix(in srgb,var(--ink) 12%,transparent);
    backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .16s;
  }
  .palette.on{opacity:1;pointer-events:auto}
  .pal{
    width:470px;max-height:66vh;display:flex;flex-direction:column;
    background:var(--paper);border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow-2);overflow:hidden;transform:translateY(-6px);transition:transform .18s;
  }
  .palette.on .pal{transform:none}
  .pal-in{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
  .pal-in svg{width:14px;height:14px;color:var(--ink-4);stroke-width:1.8;flex:none}
  .pal-in input{flex:1;font-size:14px;min-width:0}
  .pal-in input::placeholder{color:var(--ink-4)}
  .pal-list{overflow-y:auto;padding:6px}
  .pal-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .pal-row.on{background:var(--shell-2)}
  .pal-row .pt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pal-row .pd{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
  .pal-row .pk{font-size:10px;color:var(--ink-4);opacity:0}
  .pal-row.on .pk{opacity:1}
  .pal-foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--ink-4);letter-spacing:.04em}
  .pal-empty{padding:20px;text-align:center;font-size:12px;color:var(--ink-4)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:1360px){.body{--pv-w:344px}.col{padding:52px 32px 140px}}
  @media (max-width:1150px){.body{--pv-w:0px}.pv{display:none}}
</style>
</head>
<body>
<script>
  window.addEventListener('error', (e) => {
    const box = document.getElementById('list');
    if (box) box.innerHTML = '<p class="list-empty">脚本错误：' + (e.message || '未知') + '</p>';
  });
  window.addEventListener('unhandledrejection', (e) => {
    const box = document.getElementById('list');
    if (box) box.innerHTML = '<p class="list-empty">异步错误：' + ((e.reason && e.reason.message) || '未知') + '</p>';
  });
</script>
<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="mark" id="brand-mark">申</span>
      <div>
        <div class="wordmark" id="brand-title">申的博客</div>
        <div class="sub" id="brand-sub">shenblog.vercel.app</div>
      </div>
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="bar-right">
      <div class="state"><i class="dot" id="dot"></i><span id="repo-text">连接中</span></div>
      <button class="icon" id="btn-focus" title="专注模式 Ctrl+\"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg></button>
      <button class="icon" id="btn-site" title="站点信息（站名 / 标语）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.5 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.5a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 5a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.5 9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="icon" id="btn-theme" title="切换主题"></button>
      <button class="icon" id="btn-pv" title="预览面板"></button>
      <button class="ghost" id="btn-new" title="新建文章 Ctrl+N"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>新建</button>
    </div>
  </header>

  <main class="body" id="main">
    <aside class="side">
      <div class="side-top">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="搜索标题 Ctrl+K">
        </label>
      </div>
      <div class="side-meta"><span id="count-note"></span></div>
      <div class="list" id="list"></div>
    </aside>

    <section class="doc" id="doc">
      <div class="col">
        <input id="title" class="title" placeholder="标题" spellcheck="false">
        <div class="meta">
          <input id="date" class="date" type="date" title="发布时间：改完文章会自动挪到对应年份，站点顺序也跟着变">
          <input id="time" class="time" type="time" title="同一天多篇时的先后顺序（可留空）">
          <span class="sep"></span>
          <input id="tags" class="tags" placeholder="标签，逗号分隔">
        </div>
        <div class="tools" id="tools">
          <button class="tb" data-md="h2" title="二级标题"><b style="font-size:11px">H2</b></button>
          <button class="tb" data-md="h3" title="三级标题"><b style="font-size:11px">H3</b></button>
          <div></div>
          <button class="tb" data-md="bold" title="加粗 Ctrl+B"><b>B</b></button>
          <button class="tb" data-md="italic" title="斜体 Ctrl+I"><i style="font-family:Georgia,serif;font-size:13px">I</i></button>
          <button class="tb" data-md="code" title="行内代码"><b style="font-size:10.5px">&lt;/&gt;</b></button>
          <div></div>
          <button class="tb" data-md="quote" title="引用"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 7H5v5h3a3 3 0 0 1-3 3M18 7h-3v5h3a3 3 0 0 1-3 3"/></svg></button>
          <button class="tb" data-md="ul" title="列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg></button>
          <button class="tb" data-md="hr" title="分隔线"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12h16"/></svg></button>
          <div></div>
          <button class="tb" data-md="link" title="链接"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg></button>
          <button class="tb" data-md="image" title="插入图片（也可直接粘贴）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg></button>
        </div>
        <textarea id="body" placeholder="从这里开始写。Markdown 语法，图片可以直接粘贴或拖进来。" spellcheck="false"></textarea>
      </div>
    </section>

    <aside class="pv" id="pv">
      <div class="pv-head"><span>预览</span><button class="icon" id="pv-close" title="收起预览" style="width:26px;height:26px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="pv-paper" id="pv-body"><p class="pv-empty">选择一篇文章开始。</p></div>
    </aside>
  </main>

  <footer class="foot">
    <div class="foot-l">
      <span id="words">0 字</span>
      <span class="sep"></span>
      <span id="path"></span>
    </div>
    <div class="foot-m">
      <span style="display:flex;align-items:center;gap:6px"><i class="savedot" id="savedot"></i><span id="save-state">未选择文章</span></span>
      <span class="sep"></span>
      <span id="git-state"></span>
    </div>
    <div class="foot-r">
      <button class="rmv" id="btn-del" disabled>删除</button>
      <button class="primary" id="btn-pub" disabled><span id="pub-text">发布</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
    </div>
  </footer>
</div>

<div class="mask" id="mask">
  <div class="dlg">
    <h3 id="dlg-title">新建文章</h3>
    <p id="dlg-desc"></p>
    <input id="dlg-input" placeholder="文章标题">
    <div class="dlg-act">
      <button class="ghost" id="dlg-cancel" style="height:30px">取消</button>
      <button class="primary" id="dlg-ok" style="height:30px">创建</button>
    </div>
  </div>
</div>
<div class="mask" id="smask">
  <div class="dlg wide">
    <h3>站点信息</h3>
    <p>保存后本地立刻重建，并自动提交推送到 GitHub，云端几十秒后生效。</p>
    <label class="fld"><span>站名</span><input id="s-title" spellcheck="false" placeholder="申的博客"></label>
    <label class="fld"><span>标语</span><input id="s-tagline" spellcheck="false" placeholder="move fast and break things"></label>
    <label class="fld"><span>作者</span><input id="s-author" spellcheck="false" placeholder="申（顶栏左上角方块里的字）"></label>
    <label class="fld"><span>简介</span><textarea id="s-desc" rows="2" spellcheck="false" placeholder="站点简介，用于搜索引擎与 RSS"></textarea></label>
    <div class="fld themerow"><span>版式</span>
      <div class="themes" id="s-themes">
        <button type="button" data-t="classic">原版</button>
        <button type="button" data-t="a">A 廊</button>
        <button type="button" data-t="b">B 水庭</button>
        <button type="button" data-t="c">C 红土墙</button>
        <button type="button" data-t="d">D 格栅</button>
      </div>
    </div>
    <p class="hint">点一下就地重建、不推送；「保存并同步」才会提交到 GitHub，云端几十秒后生效。</p>
    <div class="dlg-act">
      <button class="ghost" id="s-preview" style="height:30px">预览站点</button>
      <button class="ghost" id="s-cancel" style="height:30px">取消</button>
      <button class="primary" id="s-ok" style="height:30px">保存并同步</button>
    </div>
  </div>
</div>
<div class="palette" id="palette">
  <div class="pal">
    <div class="pal-in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pal-q" placeholder="跳转到文章…">
    </div>
    <div class="pal-list" id="pal-list"></div>
    <div class="pal-foot"><span>↑ ↓ 选择</span><span>Enter 打开</span><span>Esc 关闭</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="picker" accept="image/*" multiple hidden>
<script src="/app.js"></script>
</body>
</html>
