<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客管理器</title>
<style>
:root{--bg:#fff;--panel:#fafaf9;--ink:#16181d;--muted:#6f7680;--line:#e8eaed;--hover:#f4f4f2;--accent:#2c5346;--accent-soft:#eef3f0;--warn:#b4772a;--ok:#2f7a5a;--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
html[data-theme="dark"]{--bg:#121316;--panel:#17181c;--ink:#e7e8ea;--muted:#9aa0a8;--line:#2a2c31;--hover:#1f2126;--accent:#7fb69f;--accent-soft:#1b2420;--warn:#d9a25f;--ok:#6bbd95}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
.logo{width:26px;height:26px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600}
.title{font-weight:600}
.repo{display:flex;align-items:center;gap:6px;font:12.5px var(--mono);color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--warn)}
.spacer{margin-left:auto}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;transition:background .16s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
html[data-theme="dark"] .btn.primary{color:#12181a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.body{height:calc(100% - 104px);display:grid;grid-template-columns:264px minmax(0,1fr) 380px}
.list{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.list-head{padding:14px 12px 8px;display:flex;gap:6px}
.filter{flex:1;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:12.5px;outline:none}
.rows{overflow-y:auto;padding:4px 8px 20px;flex:1}
.row{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--hover)}.row.on{background:var(--accent-soft)}
.row .mark{width:6px;height:6px;border-radius:50%;margin-top:8px;flex:none;background:var(--ok)}.row .mark.draft{background:var(--warn)}
.row .t{font-size:13.5px;line-height:1.45}.row.on .t{font-weight:600}
.row .d{font:11.5px var(--mono);color:var(--muted);margin-top:2px}
.editor{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:2px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.tab{height:32px;padding:0 12px;border:0;background:none;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.fm{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:86px 1fr;gap:8px 12px;align-items:center}
.fm label{font-size:12.5px;color:var(--muted)}
.fm input[type=text],.fm input[type=date]{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px;padding:0 10px;width:100%;outline:none}
.fm input:focus{border-color:var(--accent)}
.fm .draft{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.fm .path{grid-column:2;font:11.5px var(--mono);color:var(--muted);word-break:break-all}
#body{flex:1;border:0;outline:none;resize:none;padding:18px 20px 40px;background:var(--bg);color:var(--ink);font:13.5px/1.85 var(--mono);min-height:0}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-width:0}
.side-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.04em}
.preview{flex:1;overflow-y:auto;padding:24px;background:var(--bg);min-height:0;font-size:13.5px;line-height:1.8}
.preview h1{font-size:19px;margin:0 0 8px}.preview h2{font-size:16px;margin:20px 0 8px}.preview h3{font-size:14.5px;margin:16px 0 6px}
.preview p{margin:0 0 12px}.preview hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.preview code{font:12.5px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.preview img{max-width:100%;border-radius:6px}
.preview .empty{color:var(--muted)}
.publish{border-top:1px solid var(--line);padding:12px 16px 14px}
.pub-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.msg{width:100%;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:12px var(--mono);outline:none;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;font:12px var(--mono);max-height:150px;overflow-y:auto}
.steps li{display:flex;gap:8px;padding:3px 0;color:var(--muted);align-items:flex-start}
.steps li b{width:12px;flex:none;font-weight:400}
.steps li.ok{color:var(--ink)}.steps li.ok b{color:var(--ok)}
.steps li.bad{color:#c25b4d}.steps li.bad b{color:#c25b4d}
.steps li span{word-break:break-all}
.foot{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.foot .state{font-family:var(--mono)}.foot .sep{opacity:.4}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;place-items:center;z-index:50}
.mask.on{display:grid}
.dialog{width:380px;background:var(--bg);border-radius:12px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dialog h3{margin:0 0 4px;font-size:15px}.dialog p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.dialog input{width:100%;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:14px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>

<div class="bar">
  <div class="logo">申</div>
  <div class="title">博客管理器</div>
  <div class="repo"><span class="dot off" id="dot"></span><span id="repo-text">检查仓库…</span></div>
  <div class="spacer"></div>
  <button class="btn" id="btn-theme">暗色</button>
  <button class="btn primary" id="btn-new">新建文章</button>
</div>

<div class="body">
  <div class="list">
    <div class="list-head">
      <input class="filter" id="filter" placeholder="搜索标题…">
      <button class="btn" id="btn-refresh" title="刷新列表" style="padding:0 10px">↻</button>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="editor">
    <div class="tabs">
      <button class="tab on">编辑</button>
      <button class="tab" disabled title="后续版本">差异</button>
      <button class="tab" disabled title="后续版本">历史</button>
    </div>
    <div class="fm">
      <label for="f-title">标题</label><input type="text" id="f-title" placeholder="文章标题">
      <label for="f-date">日期</label><input type="date" id="f-date">
      <label for="f-tags">标签</label><input type="text" id="f-tags" placeholder="用逗号分隔，例如 随想, 沟通">
      <label for="f-sum">摘要</label><input type="text" id="f-sum" placeholder="留空自动取正文前 90 字">
      <label for="f-draft">草稿</label>
      <div class="draft"><input type="checkbox" id="f-draft"> 不发布到线上</div>
      <div class="path" id="f-path">未选择文章</div>
    </div>
    <textarea id="body" spellcheck="false" placeholder="正文，Markdown 语法。可以把图片直接拖进来。"></textarea>
  </div>

  <div class="side">
    <div class="side-head"><span>预览</span><span id="pv-meta"></span></div>
    <div class="preview" id="preview"><p class="empty">左侧选择一篇文章，或点右上「新建文章」。</p></div>
    <div class="publish">
      <div class="pub-head"><span>发布</span><span id="pub-note"></span></div>
      <input class="msg" id="msg" placeholder="commit 信息（留空自动生成）">
      <ul class="steps" id="steps"></ul>
    </div>
  </div>
</div>

<div class="foot">
  <span class="state" id="save-state">未选择文章</span>
  <span class="sep">·</span>
  <span class="state" id="git-state"></span>
  <span class="spacer"></span>
  <button class="btn" id="btn-save">保存 Ctrl+S</button>
  <button class="btn primary" id="btn-publish">发布到 GitHub</button>
</div>

<div class="mask" id="mask">
  <div class="dialog">
    <h3>新建文章</h3>
    <p>文件名会自动带上今天的日期，标题之后还能改。</p>
    <input id="new-title" placeholder="文章标题">
    <div class="actions">
      <button class="btn" id="new-cancel">取消</button>
      <button class="btn primary" id="new-ok">创建</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
